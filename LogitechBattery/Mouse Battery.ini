[Variables]
; Polling intervals in seconds: valid reading / unavailable device.
; Refresh the skin after changing this value.
RefreshSeconds=900
RetrySeconds=30
@Include=#@#Style.inc
; Display scale (1.00 = 100%).
Scale=1.50
LogitrayPath=C:\programs\logitray.exe
DeviceName=PRO X Wireless
BgWidth=160
BgHeight=76
ColorBg=0,0,0
BatteryFrame=20
BatteryText=--%
BatteryColor=144,144,144
BatteryStatus=Waiting for mouse...
ChargingHidden=1

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
DefaultAlwaysOnTop=-2
MiddleMouseUpAction=[!CommandMeasure MeasureMouseCommand "Run"]
ContextTitle=Refresh mouse battery
ContextAction=[!CommandMeasure MeasureMouseCommand "Run"]

[Metadata]
Name=Mouse Battery
Author=voji / Gadgets styling by SilverAzide
Information=Logitech mouse battery and charging status via logitray --once (USB cable or receiver). Middle-click to refresh.
License=Creative Commons Attribution-NonCommercial-ShareAlike 4.0
Version=1.1

[MeasureMouseCommand]
Measure=Plugin
Plugin=RunCommand
Program=#LogitrayPath#
Parameter=--once
State=Hide
OutputType=UTF8
OutputFile=#CURRENTPATH#LastOutput.txt
Timeout=10000
UpdateDivider=-1
FinishAction=[!CommandMeasure MeasureMouseState "ReadBattery()"]

[MeasureMouseState]
Measure=Script
ScriptFile=#CURRENTPATH#MouseBattery.lua
UpdateDivider=1

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,(#BgWidth# * #Scale#),(#BgHeight# * #Scale#) | Fill Color #ColorBg#,1 | StrokeWidth 0
Shape2=Rectangle (4 * #Scale#),(4 * #Scale#),((#BgWidth# - 8) * #Scale#),((#BgHeight# - 8) * #Scale#),(4 * #Scale#) | Fill Color #ColorBg#,(#BgAlpha# / 2) | StrokeWidth 0
Shape3=Rectangle (5 * #Scale#),(5 * #Scale#),((#BgWidth# - 10) * #Scale#),((#BgHeight# - 10) * #Scale#),(3 * #Scale#) | Fill Color #ColorBg#,#BgAlpha# | StrokeWidth 0
Shape4=Rectangle (6 * #Scale#),(6 * #Scale#),((#BgWidth# - 12) * #Scale#),((#BgHeight# - 12) * #Scale#),(2 * #Scale#) | Fill Color 164,160,160,#BgAlpha# | StrokeWidth 0
Shape5=Rectangle (7 * #Scale#),(7 * #Scale#),((#BgWidth# - 14) * #Scale#),((#BgHeight# - 14) * #Scale#),(1 * #Scale#) | Fill LinearGradient BackgroundGradient | StrokeWidth 0
BackgroundGradient=270 | 70,70,70,#BgAlpha# ; 0.0 | #ColorBg#,#BgAlpha# ; 1.0
UpdateDivider=-1

[StyleText]
FontFace=#FontName#
AntiAlias=1
TransformationMatrix=#Scale#;0;0;#Scale#;#Scale#;#Scale#
DynamicVariables=1

[MeterTitle]
Meter=String
MeterStyle=StyleText
FontSize=#FontSize2#
FontWeight=#FontWtBold#
FontColor=#ColorFontTitle#
StringAlign=Center
X=82
Y=5
Text=Mouse Battery

[MeterBatteryIcon]
Meter=Image
ImageName=#@#Battery.png
ImageCrop=(34 * #BatteryFrame#),0,34,34,1
X=10
Y=26
W=34
H=34
AntiAlias=1
DynamicVariables=1
TransformationMatrix=#Scale#;0;0;#Scale#;#Scale#;#Scale#
ToolTipText=Middle-click to refresh

; A vector lightning bolt over the existing battery image, visible only while charging.
[MeterChargingBolt]
Meter=Shape
X=10
Y=26
Shape=Path Bolt | Fill Color 255,224,65 | Stroke Color 45,45,45 | StrokeWidth 1
Bolt=20,7 | LineTo 12,19 | LineTo 17,19 | LineTo 14,29 | LineTo 24,15 | LineTo 19,15 | ClosePath 1
Hidden=#ChargingHidden#
DynamicVariables=1
TransformationMatrix=#Scale#;0;0;#Scale#;#Scale#;#Scale#
ToolTipText=Charging

[MeterDevice]
Meter=String
MeterStyle=StyleText
FontSize=8
FontColor=#ColorFontSubtitle#
X=47
Y=25
W=103
H=14
ClipString=1
Text=#DeviceName#

[MeterPercent]
Meter=String
MeterStyle=StyleText
FontSize=12
FontWeight=#FontWtBold#
FontColor=#BatteryColor#
StringAlign=LeftCenter
X=47
Y=46
Text=#BatteryText#

[MeterStatus]
Meter=String
MeterStyle=StyleText
FontSize=7
FontColor=#BatteryColor#
StringAlign=RightCenter
X=149
Y=46
Text=#BatteryStatus#
